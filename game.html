<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #03050a; color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }
        .container {
            position: relative;
            width: 400px; height: 520px;
            border: 2px solid rgba(0,255,245,0.4); border-radius: 20px;
            background-color: #03050a;
            box-shadow: 0 0 30px rgba(0,255,245,0.2);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .menu-screen {
            position: absolute; width: 100%; height: 100%;
            background: rgba(3, 5, 10, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; transition: opacity 0.3s ease;
        }
        .menu-screen.hidden { opacity: 0; pointer-events: none; }
        h1 { color: #00fff5; font-size: 26px; margin-bottom: 5px; text-shadow: 0 0 15px rgba(0,255,245,0.7); text-align: center; }
        .subtitle { color: #8892b0; font-size: 13px; margin-bottom: 25px; text-align: center; }
        
        .menu-btn {
            width: 200px; padding: 12px 0; margin: 8px 0;
            font-size: 16px; font-weight: 800;
            background: linear-gradient(135deg, #00fff5, #7000ff);
            color: #fff; border: none; border-radius: 14px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(0,255,245,0.4);
            transition: transform 0.1s, filter 0.2s;
        }
        .menu-btn:hover { filter: brightness(1.2); transform: translateY(-2px); }
        .menu-btn:active { transform: scale(0.95); }

        .hud {
            position: absolute; top: 12px; left: 16px; right: 16px;
            display: flex; justify-content: space-between;
            font-size: 15px; font-weight: bold; z-index: 5;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }
        canvas { outline: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="menu-screen" id="menuScreen">
        <h1>🛸 ALIEN SHOOTER 🌌</h1>
        <div class="subtitle">Dùng Mũi tên/A-D để lái, Phím Cách để bắn Laser!</div>
        <button class="menu-btn" onclick="startGame()">CHIẾN NGAY ▶</button>
    </div>

    <div class="hud">
        <div>Điểm: <span id="score" style="color: #00fff5;">0</span></div>
        <div>Mạng: <span id="lives" style="color: #ff4b4b;">❤️❤️❤️</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="520" tabindex="1"></canvas>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const livesElement = document.getElementById("lives");
    const menuScreen = document.getElementById("menuScreen");

    let score = 0, lives = 3, isPlaying = false, gameInterval = null;
    let player = { x: 180, y: 430, width: 48, height: 42, speed: 6, dx: 0 };
    let bullets = [], enemies = [], stars = [], enemyDirection = 1;

    for(let i=0; i<60; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 0.5,
            speed: Math.random() * 1.5 + 0.5
        });
    }

    function createEnemies() {
        enemies = [];
        let rows = 3, cols = 5, startX = 55, startY = 60, spacingX = 60, spacingY = 48;
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                enemies.push({ x: startX + c * spacingX, y: startY + r * spacingY, width: 40, height: 32, alive: true });
            }
        }
    }

    function startGame() {
        menuScreen.classList.add("hidden");
        isPlaying = true; score = 0; lives = 3; bullets = []; player.x = 180;
        scoreElement.textContent = score; updateLivesDisplay(); createEnemies();
        canvas.focus();
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, 1000 / 60);
    }

    function updateLivesDisplay() {
        let hearts = "";
        for(let i=0; i<lives; i++) hearts += "❤️";
        livesElement.textContent = hearts;
    }

    function gameLoop() { update(); draw(); }

    function update() {
        player.x += player.dx;
        if (player.x < 0) player.x = 0;
        if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].y -= 12;
            if (bullets[i].y < 0) bullets.splice(i, 1);
        }

        let hitEdge = false, aliveCount = 0;
        enemies.forEach(e => {
            if (!e.alive) return;
            aliveCount++;
            e.x += 0.8 * enemyDirection;
            if (e.x <= 20 || e.x + e.width >= canvas.width - 20) hitEdge = true;
        });

        if (hitEdge) {
            enemyDirection *= -1;
            enemies.forEach(e => {
                e.y += 12;
                if (e.y + e.height >= player.y) endGame();
            });
        }

        if (aliveCount === 0) createEnemies();

        for (let i = bullets.length - 1; i >= 0; i--) {
            let bulletHit = false;
            for (let j = 0; j < enemies.length; j++) {
                let e = enemies[j];
                if (e.alive && bullets[i].x > e.x && bullets[i].x < e.x + e.width && bullets[i].y > e.y && bullets[i].y < e.y + e.height) {
                    e.alive = false; bulletHit = true; score += 20; scoreElement.textContent = score; break;
                }
            }
            if (bulletHit) bullets.splice(i, 1);
        }

        stars.forEach(star => {
            star.y += star.speed;
            if (star.y > canvas.height) star.y = 0;
        });
    }

    function draw() {
        ctx.fillStyle = "#03050a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#ffffff";
        stars.forEach(star => { ctx.fillRect(star.x, star.y, star.size, star.size); });

        // --- TÀU PHI THUYỀN XANH NGỌC HẦM HỐ ---
        let px = player.x, py = player.y;
        
        // Động cơ phản lực
        ctx.fillStyle = "#ff5964";
        ctx.fillRect(px + 10, py + player.height, 6, 10 + Math.random() * 6);
        ctx.fillRect(px + player.width - 16, py + player.height, 6, 10 + Math.random() * 6);

        // Thân tàu góc cạnh
        ctx.fillStyle = "#00b4d8";
        ctx.beginPath();
        ctx.moveTo(px + player.width / 2, py);
        ctx.lineTo(px, py + player.height);
        ctx.lineTo(px + player.width, py + player.height);
        ctx.closePath();
        ctx.fill();

        // Giáp cạnh màu trắng/xám
        ctx.fillStyle = "#90e0ef";
        ctx.beginPath();
        ctx.moveTo(px + player.width / 2, py + 4);
        ctx.lineTo(px + 6, py + player.height - 4);
        ctx.lineTo(px + player.width - 6, py + player.height - 4);
        ctx.closePath();
        ctx.fill();

        // Buồng lái vàng phát sáng
        ctx.fillStyle = "#ffb703";
        ctx.beginPath();
        ctx.ellipse(px + player.width / 2, py + 20, 5, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        // --- TIA LASER VÀNG RỰC RỠ TRÊN ĐẦU PHI THUYỀN ---
        ctx.fillStyle = "#ffb703";
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#ffb703";
        ctx.fillRect(px + player.width / 2 - 3, 0, 6, py);
        ctx.shadowBlur = 0; // Reset hiệu ứng

        // Đạn thường hai bên
        ctx.fillStyle = "#ffb703";
        bullets.forEach(b => { ctx.fillRect(b.x - 2, b.y, 4, 14); });

        // --- ĐÀN QUÁI VẬT CÔN TRÙNG VŨ TRỤ ---
        enemies.forEach(e => {
            if (!e.alive) return;
            let ex = e.x, ey = e.y;

            // Thân côn trùng hồng/tím
            ctx.fillStyle = "#f72585";
            ctx.beginPath();
            ctx.ellipse(ex + e.width/2, ey + e.height/2, 14, 12, 0, 0, Math.PI*2);
            ctx.fill();

            // Cánh côn trùng pha hồng-vàng
            ctx.fillStyle = "#ffb703";
            ctx.beginPath();
            ctx.moveTo(ex, ey + 4);
            ctx.lineTo(ex - 12, ey - 6);
            ctx.lineTo(ex + 4, ey + 12);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(ex + e.width, ey + 4);
            ctx.lineTo(ex + e.width + 12, ey - 6);
            ctx.lineTo(ex + e.width - 4, ey + 12);
            ctx.closePath();
            ctx.fill();

            // Mắt xanh ngọc
            ctx.fillStyle = "#4cc9f0";
            ctx.beginPath();
            ctx.arc(ex + e.width/2, ey + 8, 5, 0, Math.PI*2);
            ctx.fill();
        });
    }

    function endGame() {
        isPlaying = false;
        clearInterval(gameInterval);
        menuScreen.querySelector("h1").textContent = "GAME OVER 💀";
        menuScreen.querySelector(".menu-btn").textContent = "CHƠI LẠI 🔄";
        menuScreen.classList.remove("hidden");
    }

    window.addEventListener("keydown", (e) => {
        if (!isPlaying) return;
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") player.dx = -player.speed;
        if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") player.dx = player.speed;
        if (e.key === " " || e.key === "ArrowUp") {
            bullets.push({ x: player.x + 10, y: player.y });
            bullets.push({ x: player.x + player.width - 10, y: player.y });
            e.preventDefault();
        }
    });

    window.addEventListener("keyup", (e) => {
        if ((e.key === "ArrowLeft" || e.key === "a" || e.key === "A") && player.dx < 0) player.dx = 0;
        if ((e.key === "ArrowRight" || e.key === "d" || e.key === "D") && player.dx > 0) player.dx = 0;
    });

    canvas.addEventListener("click", () => { canvas.focus(); });
</script>

</body>
</html>
