<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Pixel Shooter Deluxe</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #020408; color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }
        .container {
            position: relative;
            width: 400px; height: 520px;
            border: 2px solid #00f0ff; border-radius: 20px;
            background: radial-gradient(circle at center, #0a1128 0%, #020408 100%);
            box-shadow: 0 0 35px rgba(0,240,255,0.3);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .hud {
            position: absolute; top: 12px; left: 16px; right: 16px;
            display: flex; justify-content: space-between;
            font-size: 14px; font-weight: bold; z-index: 5;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
        }
        canvas { outline: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="hud">
        <div>Điểm: <span id="score" style="color: #00f0ff;">0</span></div>
        <div id="stageIndicator" style="color: #ffb703;">GIAI ĐOẠN 1</div>
        <div>Mạng: <span id="lives" style="color: #ff3366;">♥♥♥</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="520" tabindex="1"></canvas>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const livesElement = document.getElementById("lives");
    const stageIndicator = document.getElementById("stageIndicator");

    let gameState = 'menu';
    let score = 0, lives = 3, difficulty = 'normal', currentStage = 1;
    let player = { 
        x: 175, y: 440, width: 48, height: 48, speed: 6.5, dx: 0,
        powerDouble: false, powerFast: false, powerTimer: 0 
    };
    let bullets = [], enemies = [], stars = [], particles = [], enemyBullets = [], powerUps = [], boss = null;
    let shootCooldown = 0, spawnTimer = 0;

    for(let i=0; i<80; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 0.5,
            speed: Math.random() * 2 + 0.5,
            alpha: Math.random() * 0.8 + 0.2
        });
    }

    function initStage() {
        enemies = [];
        boss = null;
        spawnTimer = 0;
        if (currentStage === 1) {
            stageIndicator.textContent = "GIAI ĐOẠN 1";
            for (let i = 0; i < 5; i++) {
                enemies.push(createFreeAlien());
            }
        } else if (currentStage === 2) {
            stageIndicator.textContent = "GIAI ĐOẠN 2";
            for (let i = 0; i < 10; i++) {
                enemies.push(createFreeAlien());
            }
        } else if (currentStage === 3) {
            stageIndicator.textContent = "TRẬN CHIẾN BOSS";
            boss = {
                x: 150, y: 50, width: 100, height: 70,
                hp: 45, maxHp: 45, dx: 1.8, anim: 0
            };
        }
    }

    function createFreeAlien() {
        return {
            x: Math.random() * (canvas.width - 60) + 30,
            y: Math.random() * 100 + 40,
            vx: (Math.random() - 0.5) * 2.2,
            vy: (Math.random() - 0.2) * 1.2 + 0.4,
            width: 42, height: 38,
            alive: true,
            anim: Math.random() * Math.PI * 2,
            speedOffset: 0.7 + Math.random() * 0.5
        };
    }

    function startGame(selectedDiff) {
        difficulty = selectedDiff;
        gameState = 'playing';
        score = 0; 
        lives = (difficulty === 'hard') ? 2 : 3; 
        currentStage = 1;
        bullets = []; enemyBullets = []; particles = []; powerUps = []; 
        player.x = 175; player.powerDouble = false; player.powerFast = false;
        scoreElement.textContent = score; 
        updateLivesDisplay(); 
        initStage();
        canvas.focus();
    }

    function updateLivesDisplay() {
        let hearts = "";
        for (let i = 0; i < lives; i++) hearts += "♥";
        livesElement.textContent = hearts;
    }

    function addExplosion(x, y, color) {
        for(let i=0; i<14; i++) {
            let angle = Math.random() * Math.PI * 2;
            let speed = Math.random() * 3.5 + 1;
            particles.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                radius: Math.random() * 2.5 + 1,
                color: color, alpha: 1, decay: 0.03
            });
        }
    }

    canvas.addEventListener("click", (e) => {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        if (gameState === 'menu') {
            if (mouseX >= 100 && mouseX <= 300 && mouseY >= 280 && mouseY <= 330) {
                gameState = 'difficulty';
            }
        } else if (gameState === 'difficulty') {
            if (mouseX >= 100 && mouseX <= 300 && mouseY >= 220 && mouseY <= 265) startGame('easy');
            else if (mouseX >= 100 && mouseX <= 300 && mouseY >= 285 && mouseY <= 330) startGame('normal');
            else if (mouseX >= 100 && mouseX <= 300 && mouseY >= 350 && mouseY <= 395) startGame('hard');
        } else if (gameState === 'gameover' || gameState === 'victory') {
            if (mouseX >= 100 && mouseX <= 300 && mouseY >= 310 && mouseY <= 360) gameState = 'menu';
        }
    });

    setInterval(() => {
        update();
        draw();
    }, 1000 / 60);

    function update() {
        if (gameState !== 'playing') return;

        if (shootCooldown > 0) shootCooldown--;

        if (player.powerFast || player.powerDouble) {
            player.powerTimer--;
            if (player.powerTimer <= 0) {
                player.powerFast = false;
                player.powerDouble = false;
            }
        }

        player.x += player.dx;
        if (player.x < 0) player.x = 0;
        if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

        // Đạn người chơi
        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].y -= 11;
            if (bullets[i].y < 0) bullets.splice(i, 1);
        }

        // Cập nhật vật phẩm rơi
        for (let i = powerUps.length - 1; i >= 0; i--) {
            powerUps[i].y += 2;
            if (powerUps[i].x > player.x && powerUps[i].x < player.x + player.width &&
                powerUps[i].y > player.y && powerUps[i].y < player.y + player.height) {
                
                let type = powerUps[i].type;
                if (type === 'hp') {
                    lives++;
                    updateLivesDisplay();
                } else if (type === 'double') {
                    player.powerDouble = true;
                    player.powerTimer = 500;
                } else if (type === 'fast') {
                    player.powerFast = true;
                    player.powerTimer = 500;
                }
                powerUps.splice(i, 1);
            } else if (powerUps[i].y > canvas.height) {
                powerUps.splice(i, 1);
            }
        }

        // Tốc độ bắn laser của địch
        let alienShootChance = currentStage === 1 ? 0.005 : 0.01;
        if (Math.random() < alienShootChance) {
            let activeEnemies = enemies.filter(e => e.alive);
            if (activeEnemies.length > 0) {
                let shooter = activeEnemies[Math.floor(Math.random() * activeEnemies.length)];
                enemyBullets.push({ x: shooter.x + shooter.width/2, y: shooter.y + shooter.height, speed: 3.2 });
            }
        }

        for (let i = enemyBullets.length - 1; i >= 0; i--) {
            enemyBullets[i].y += enemyBullets[i].speed;
            if (enemyBullets[i].x > player.x && enemyBullets[i].x < player.x + player.width &&
                enemyBullets[i].y > player.y && enemyBullets[i].y < player.y + player.height) {
                enemyBullets.splice(i, 1);
                lives--;
                updateLivesDisplay();
                addExplosion(player.x + player.width/2, player.y + player.height/2, "#ff3366");
                if (lives <= 0) endGame();
            } else if (enemyBullets[i].y > canvas.height) {
                enemyBullets.splice(i, 1);
            }
        }

        // Xử lý Giai đoạn 1 & 2
        if (currentStage === 1 || currentStage === 2) {
            // Cứ mỗi 5 giây (300 frames) tạo thêm 3 tàu alien nhỏ tiếp viện
            spawnTimer++;
            if (spawnTimer >= 300) {
                spawnTimer = 0;
                for (let k = 0; k < 3; k++) {
                    enemies.push(createFreeAlien());
                }
            }

            let aliveCount = 0;
            enemies.forEach(e => {
                if (!e.alive) return;
                aliveCount++;
                
                e.x += e.vx;
                e.y += e.vy;
                e.anim += 0.04;

                if (e.x <= 10 || e.x + e.width >= canvas.width - 10) e.vx *= -1;
                if (e.y <= 30 || e.y >= 280) e.vy *= -1;

                if (e.y > player.y) {
                    e.alive = false;
                    lives--;
                    updateLivesDisplay();
                    addExplosion(e.x + e.width/2, e.y, "#ff3366");
                    if (lives <= 0) endGame();
                }
            });

            // Tiến tới giai đoạn tiếp theo nếu tiêu diệt sạch hoặc đạt mốc điểm chiến dịch
            if (score >= 200 && currentStage === 1) {
                currentStage = 2;
                initStage();
            } else if (score >= 600 && currentStage === 2) {
                currentStage = 3;
                initStage();
            }
        } 
        // Xử lý Boss Stage
        else if (currentStage === 3 && boss) {
            boss.x += boss.dx;
            boss.anim += 0.06;
            if (boss.x <= 15 || boss.x + boss.width >= canvas.width - 15) boss.dx *= -1;

            if (Math.random() < 0.03) {
                enemyBullets.push({ x: boss.x + 25, y: boss.y + boss.height, speed: 4.5 });
                enemyBullets.push({ x: boss.x + boss.width / 2, y: boss.y + boss.height, speed: 5 });
                enemyBullets.push({ x: boss.x + boss.width - 25, y: boss.y + boss.height, speed: 4.5 });
            }
        }

        // Va chạm đạn người chơi với quái và boss
        for (let i = bullets.length - 1; i >= 0; i--) {
            let bulletHit = false;
            
            for (let j = 0; j < enemies.length; j++) {
                let e = enemies[j];
                if (e.alive && bullets[i].x > e.x && bullets[i].x < e.x + e.width && bullets[i].y > e.y && bullets[i].y < e.y + e.height) {
                    e.alive = false; 
                    bulletHit = true; 
                    score += 20; 
                    scoreElement.textContent = score;
                    addExplosion(e.x + e.width/2, e.y + e.height/2, "#ff007f");

                    // Tỷ lệ rơi vật phẩm (khoảng 35%)
                    if (Math.random() < 0.35) {
                        let rand = Math.random();
                        let pType = rand < 0.33 ? 'hp' : (rand < 0.66 ? 'double' : 'fast');
                        powerUps.push({ x: e.x + e.width/2, y: e.y, type: pType });
                    }
                    break;
                }
            }

            if (!bulletHit && boss && bullets[i].x > boss.x && bullets[i].x < boss.x + boss.width && bullets[i].y > boss.y && bullets[i].y < boss.y + boss.height) {
                bulletHit = true;
                boss.hp--;
                addExplosion(bullets[i].x, bullets[i].y, "#00f0ff");
                if (boss.hp <= 0) {
                    addExplosion(boss.x + boss.width/2, boss.y + boss.height/2, "#ff3366");
                    score += 500;
                    scoreElement.textContent = score;
                    gameState = 'victory';
                }
            }

            if (bulletHit) bullets.splice(i, 1);
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].x += particles[i].vx;
            particles[i].y += particles[i].vy;
            particles[i].alpha -= particles[i].decay;
            if (particles[i].alpha <= 0) particles.splice(i, 1);
        }

        stars.forEach(star => {
            star.y += star.speed;
            if (star.y > canvas.height) star.y = 0;
        });
    }

    function draw() {
        ctx.fillStyle = "#020408";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        stars.forEach(star => {
            ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
            ctx.fillRect(star.x, star.y, star.size, star.size);
        });

        particles.forEach(p => {
            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });

        if (gameState === 'playing') {
            // Đạn người chơi
            ctx.save();
            ctx.shadowBlur = 12;
            ctx.shadowColor = "#00f0ff";
            ctx.fillStyle = "#00f0ff";
            bullets.forEach(b => { ctx.fillRect(b.x - 2, b.y, 4, 12); });
            ctx.restore();

            // Vẽ vật phẩm đúng chuẩn hình ảnh trực quan theo tên gọi
            powerUps.forEach(p => {
                ctx.save();
                let px = p.x, py = p.y;
                if (p.type === 'hp') {
                    // Hình trái tim đỏ +HP
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = "#ff3366";
                    ctx.fillStyle = "#ff3366";
                    ctx.beginPath();
                    ctx.arc(px - 5, py - 3, 6, Math.PI, 0, false);
                    ctx.arc(px + 5, py - 3, 6, Math.PI, 0, false);
                    ctx.lineTo(px, py + 8);
                    ctx.fill();
                } else if (p.type === 'double') {
                    // Hình 2 nòng súng song song (2X)
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = "#ffb703";
                    ctx.fillStyle = "#ffb703";
                    ctx.fillRect(px - 9, py - 6, 6, 12);
                    ctx.fillRect(px + 3, py - 6, 6, 12);
                    ctx.fillStyle = "#fff";
                    ctx.fillRect(px - 7, py - 2, 4, 4);
                    ctx.fillRect(px + 5, py - 2, 4, 4);
                } else if (p.type === 'fast') {
                    // Hình tia chớp năng lượng xanh lá (FAST)
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = "#06d6a0";
                    ctx.fillStyle = "#06d6a0";
                    ctx.beginPath();
                    ctx.moveTo(px + 2, py - 10);
                    ctx.lineTo(px - 6, py + 1);
                    ctx.lineTo(px + 1, py + 1);
                    ctx.lineTo(px - 2, py + 10);
                    ctx.lineTo(px + 7, py - 2);
                    ctx.lineTo(px, py - 2);
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.restore();
            });

            // Đạn địch
            ctx.save();
            ctx.shadowBlur = 8;
            ctx.shadowColor = "#ff3366";
            ctx.fillStyle = "#ff3366";
            enemyBullets.forEach(eb => { ctx.fillRect(eb.x - 2, eb.y, 4, 10); });
            ctx.restore();

            // Tàu Player
            let px = player.x, py = player.y, s = 1.5;
            ctx.save();
            ctx.shadowBlur = 18;
            ctx.shadowColor = "#ff5500";
            ctx.fillStyle = "#ff5500";
            let flameHeight = (6 + Math.random() * 8) * s;
            ctx.fillRect(px + 12*s, py + 29*s, 2*s, flameHeight);
            ctx.fillRect(px + 18*s, py + 29*s, 2*s, flameHeight);
            ctx.restore();

            ctx.fillStyle = "#ff5500";
            ctx.fillRect(px + 12*s, py + 25*s, 2*s, 4*s);
            ctx.fillRect(px + 18*s, py + 25*s, 2*s, 4*s);
            ctx.fillStyle = "#ff0055";
            ctx.fillRect(px + 11*s, py + 23*s, 3*s, 2*s);
            ctx.fillRect(px + 18*s, py + 23*s, 3*s, 2*s);

            ctx.fillStyle = "#00ffff";
            ctx.fillRect(px + 15*s, py + 1*s, 2*s, 3*s);
            ctx.fillStyle = "#00b4d8";
            ctx.fillRect(px + 14*s, py + 4*s, 4*s, 3*s);
            ctx.fillStyle = "#0077b6";
            ctx.fillRect(px + 13*s, py + 7*s, 6*s, 5*s);
            ctx.fillStyle = "#03045e";
            ctx.fillRect(px + 12*s, py + 12*s, 8*s, 7*s);
            ctx.fillStyle = "#00b4d8";
            ctx.fillRect(px + 13*s, py + 13*s, 6*s, 5*s);

            ctx.save();
            ctx.shadowBlur = 12;
            ctx.shadowColor = "#ffb703";
            ctx.fillStyle = "#ffb703";
            ctx.fillRect(px + 15*s, py + 6*s, 2*s, 4*s);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(px + 15*s, py + 7*s, 1*s, 2*s);
            ctx.restore();

            ctx.fillStyle = "#ff007f";
            ctx.fillRect(px + 9*s, py + 13*s, 3*s, 4*s);
            ctx.fillRect(px + 6*s, py + 15*s, 3*s, 4*s);
            ctx.fillStyle = "#7209b7";
            ctx.fillRect(px + 3*s, py + 17*s, 3*s, 4*s);
            ctx.fillStyle = "#ff5500";
            ctx.fillRect(px + 2*s, py + 21*s, 2*s, 3*s);

            ctx.fillStyle = "#ff007f";
            ctx.fillRect(px + 20*s, py + 13*s, 3*s, 4*s);
            ctx.fillRect(px + 23*s, py + 15*s, 3*s, 4*s);
            ctx.fillStyle = "#7209b7";
            ctx.fillRect(px + 26*s, py + 17*s, 3*s, 4*s);
            ctx.fillStyle = "#ff5500";
            ctx.fillRect(px + 28*s, py + 21*s, 2*s, 3*s);

            ctx.save();
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#00f0ff";
            ctx.fillStyle = "#00f0ff";
            ctx.fillRect(px + 3*s, py + 14*s, 2*s, 4*s);
            ctx.fillRect(px + 27*s, py + 14*s, 2*s, 4*s);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(px + 3*s, py + 13*s, 2*s, 1*s);
            ctx.fillRect(px + 27*s, py + 13*s, 2*s, 1*s);
            ctx.restore();

            ctx.fillStyle = "#90e0ef";
            ctx.fillRect(px + 11*s, py + 19*s, 1*s, 5*s);
            ctx.fillRect(px + 20*s, py + 19*s, 1*s, 5*s);

            // Vẽ quái thường
            if (currentStage === 1 || currentStage === 2) {
                enemies.forEach(e => {
                    if (!e.alive) return;
                    let ex = e.x, ey = e.y, es = 1.6;

                    ctx.fillStyle = "#ff007f";
                    ctx.fillRect(ex + 2*es, ey + 6*es, 4*es, 4*es);
                    ctx.fillRect(ex - 2*es, ey + 4*es, 4*es, 3*es);
                    ctx.fillRect(ex + 15*es, ey + 6*es, 4*es, 4*es);
                    ctx.fillRect(ex + 19*es, ey + 4*es, 4*es, 3*es);

                    ctx.fillStyle = "#560bad";
                    ctx.fillRect(ex + 5*es, ey + 4*es, 11*es, 11*es);
                    ctx.fillStyle = "#7209b7";
                    ctx.fillRect(ex + 6*es, ey + 5*es, 9*es, 9*es);

                    ctx.fillStyle = "#f77f00";
                    ctx.fillRect(ex + 7*es, ey + 2*es, 7*es, 4*es);
                    ctx.fillStyle = "#fcbf49";
                    ctx.fillRect(ex + 9*es, ey + 1*es, 3*es, 2*es);

                    ctx.save();
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "#ff0055";
                    ctx.fillStyle = "#ff0055";
                    ctx.fillRect(ex + 7*es, ey + 6*es, 2*es, 3*es);
                    ctx.fillRect(ex + 12*es, ey + 6*es, 2*es, 3*es);
                    ctx.restore();

                    ctx.fillStyle = "#4cc9f0";
                    ctx.fillRect(ex + 1*es, ey + 9*es, 3*es, 2*es);
                    ctx.fillRect(ex + 17*es, ey + 9*es, 3*es, 2*es);
                });
            } 
            // Thiết kế Boss cực ngầu, đẹp mắt với giáp cyber và lõi phản ứng năng lượng chớp nháy
            else if (currentStage === 3 && boss) {
                let bx = boss.x, by = boss.y;
                ctx.save();
                ctx.shadowBlur = 25;
                ctx.shadowColor = "#00f0ff";

                // Cánh giáp phụ ngoài cùng
                ctx.fillStyle = "#3a0ca3";
                ctx.fillRect(bx - 12, by + 18, 16, 25);
                ctx.fillRect(bx + boss.width - 4, by + 18, 16, 25);

                // Giáp thân chính hầm hố
                ctx.fillStyle = "#4361ee";
                ctx.fillRect(bx + 10, by + 8, boss.width - 20, 36);
                ctx.fillStyle = "#7209b7";
                ctx.fillRect(bx + 18, by + 12, boss.width - 36, 28);

                // Buồng lái / Lõi lò phản ứng trung tâm chớp nháy năng lượng
                let coreColor = Math.floor(boss.anim * 10) % 2 === 0 ? "#ff007f" : "#4cc9f0";
                ctx.fillStyle = coreColor;
                ctx.shadowColor = coreColor;
                ctx.fillRect(bx + boss.width/2 - 12, by + 18, 24, 16);
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(bx + boss.width/2 - 4, by + 22, 8, 8);

                // Pháo plasma đôi gắn hai bên
                ctx.fillStyle = "#f77f00";
                ctx.fillRect(bx + 6, by + 35, 8, 18);
                ctx.fillRect(bx + boss.width - 14, by + 35, 8, 18);

                ctx.restore();

                // Thanh máu Boss
                ctx.fillStyle = "#222";
                ctx.fillRect(bx, by - 14, boss.width, 6);
                ctx.fillStyle = "#ff3366";
                ctx.fillRect(bx, by - 14, boss.width * (boss.hp / boss.maxHp), 6);
            }
        } 
        else if (gameState === 'menu') {
            ctx.fillStyle = "rgba(2, 4, 8, 0.95)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#00f0ff";
            ctx.font = "bold 22px 'Plus Jakarta Sans'";
            ctx.textAlign = "center";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#00f0ff";
            ctx.fillText("GALAXY PIXEL STRIKE", canvas.width / 2, 180);
            ctx.shadowBlur = 0;

            ctx.fillStyle = "#8892b0";
            ctx.font = "12px 'Plus Jakarta Sans'";
            ctx.fillText("Dùng A-D hoặc Mũi tên để di chuyển • Phím Cách bắn đạn", canvas.width / 2, 220);

            ctx.fillStyle = "#00f0ff";
            ctx.fillRect(100, 280, 200, 50);
            ctx.fillStyle = "#020408";
            ctx.font = "bold 18px 'Plus Jakarta Sans'";
            ctx.fillText("CHƠI NGAY", canvas.width / 2, 312);
        }
        else if (gameState === 'difficulty') {
            ctx.fillStyle = "rgba(2, 4, 8, 0.96)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#00f0ff";
            ctx.font = "bold 22px 'Plus Jakarta Sans'";
            ctx.textAlign = "center";
            ctx.fillText("CHỌN ĐỘ KHÓ", canvas.width / 2, 140);
            
            ctx.fillStyle = "#8892b0";
            ctx.font = "13px 'Plus Jakarta Sans'";
            ctx.fillText("SELECT DIFFICULTY", canvas.width / 2, 168);

            ctx.fillStyle = "#06d6a0";
            ctx.fillRect(100, 220, 200, 45);
            ctx.fillStyle = "#020408";
            ctx.font = "bold 16px 'Plus Jakarta Sans'";
            ctx.fillText("DỄ", canvas.width / 2, 248);

            ctx.fillStyle = "#ffb703";
            ctx.fillRect(100, 285, 200, 45);
            ctx.fillStyle = "#020408";
            ctx.fillText("BÌNH THƯỜNG", canvas.width / 2, 313);

            ctx.fillStyle = "#ff3366";
            ctx.fillRect(100, 350, 200, 45);
            ctx.fillStyle = "#fff";
            ctx.fillText("KHÓ", canvas.width / 2, 378);
        }
        else if (gameState === 'gameover' || gameState === 'victory') {
            ctx.fillStyle = "rgba(2, 4, 8, 0.96)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = gameState === 'victory' ? "#06d6a0" : "#ff3366";
            ctx.font = "bold 24px 'Plus Jakarta Sans'";
            ctx.textAlign = "center";
            ctx.shadowBlur = 15;
            ctx.shadowColor = ctx.fillStyle;
            ctx.fillText(gameState === 'victory' ? "CHIẾN THẮNG" : "TRÒ CHƠI KẾT THÚ", canvas.width / 2, 180);
            ctx.shadowBlur = 0;

            ctx.fillStyle = "#fff";
            ctx.font = "16px 'Plus Jakarta Sans'";
            ctx.fillText("Tổng điểm: " + score, canvas.width / 2, 230);

            ctx.fillStyle = "#00f0ff";
            ctx.fillRect(100, 310, 200, 50);
            ctx.fillStyle = "#020408";
            ctx.font = "bold 16px 'Plus Jakarta Sans'";
            ctx.fillText("CHƠI LẠI", canvas.width / 2, 342);
        }
    }

    function endGame() {
        gameState = 'gameover';
    }

    window.addEventListener("keydown", (e) => {
        if (gameState !== 'playing') return;
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") player.dx = -player.speed;
        if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") player.dx = player.speed;
        if (e.key === " " || e.key === "ArrowUp") {
            let limitCooldown = player.powerFast ? 8 : 15;
            if (shootCooldown <= 0) {
                if (player.powerDouble) {
                    bullets.push({ x: player.x + 12, y: player.y });
                    bullets.push({ x: player.x + player.width - 12, y: player.y });
                } else {
                    bullets.push({ x: player.x + player.width / 2, y: player.y });
                }
                shootCooldown = limitCooldown;
            }
            e.preventDefault();
        }
    });

    window.addEventListener("keyup", (e) => {
        if ((e.key === "ArrowLeft" || e.key === "a" || e.key === "A") && player.dx < 0) player.dx = 0;
        if ((e.key === "ArrowRight" || e.key === "d" || e.key === "D") && player.dx > 0) player.dx = 0;
    });

    canvas.addEventListener("click", () => { canvas.focus(); });
</script>

</body>
</html>
