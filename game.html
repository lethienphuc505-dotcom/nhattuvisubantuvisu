<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNAKE.IO: CHIẾN TRƯỜNG MÃN XÀ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0f18;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        #game-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #090a10;
        }

        /* UI Overlays */
        .hud-panel {
            position: absolute;
            pointer-events: none;
            z-index: 10;
        }

        /* Leaderboard */
        #leaderboard {
            top: 15px;
            right: 15px;
            background: rgba(15, 20, 35, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 18px;
            min-width: 200px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        #leaderboard h3 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #f39c12;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
            text-align: center;
        }

        #leaderboard-list {
            list-style: none;
            font-size: 13px;
        }

        #leaderboard-list li {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-weight: 500;
        }

        #leaderboard-list li.me {
            color: #2ecc71;
            font-weight: bold;
        }

        /* Stats HUD */
        #stats-hud {
            bottom: 20px;
            left: 20px;
            background: rgba(15, 20, 35, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 14px;
        }

        #stats-hud span {
            color: #00f0ff;
            font-weight: bold;
        }

        /* Minimap */
        #minimap-container {
            bottom: 20px;
            right: 20px;
            width: 130px;
            height: 130px;
            background: rgba(10, 15, 25, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        #minimap {
            width: 100%;
            height: 100%;
        }

        /* Mobile Controls */
        #mobile-controls {
            display: none;
            position: absolute;
            bottom: 30px;
            width: 100%;
            justify-content: space-between;
            padding: 0 30px;
            pointer-events: none;
            z-index: 20;
        }

        #joystick-zone {
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
            position: relative;
            pointer-events: auto;
        }

        #joystick-knob {
            width: 50px;
            height: 50px;
            background: rgba(0, 240, 255, 0.6);
            border-radius: 50%;
            position: absolute;
            top: 35px;
            left: 35px;
            box-shadow: 0 0 15px #00f0ff;
        }

        #boost-btn {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #ff0055, #ff5500);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            color: white;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
            pointer-events: auto;
            touch-action: manipulation;
            border: 2px solid rgba(255,255,255,0.4);
        }

        #boost-btn:active {
            transform: scale(0.95);
            background: linear-gradient(135deg, #ff5500, #ff0055);
        }

        /* Start/Game Over Screens */
        .modal-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 10, 18, 0.88);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-card {
            background: rgba(20, 26, 45, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 35px;
            border-radius: 20px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.6);
        }

        .modal-card h1 {
            font-size: 28px;
            background: linear-gradient(45deg, #00f0ff, #ff0055);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.4);
            color: #fff;
            font-size: 16px;
            outline: none;
            text-align: center;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        /* Skin Selector */
        .skin-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .skin-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: 0.2s;
        }

        .skin-option.active {
            border-color: #fff;
            transform: scale(1.15);
            box-shadow: 0 0 12px rgba(255,255,255,0.8);
        }

        .btn-play {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #00f0ff, #0077ff);
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 240, 255, 0.4);
            transition: 0.2s;
        }

        .btn-play:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 240, 255, 0.6);
        }

        .hidden {
            display: none !important;
        }

        /* Instructions */
        .controls-hint {
            margin-top: 15px;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <!-- UI Overlay Panels -->
    <div id="leaderboard" class="hud-panel">
        <h3>BẢNG XẾP HẠNG</h3>
        <ul id="leaderboard-list"></ul>
    </div>

    <div id="stats-hud" class="hud-panel">
        Chiều dài: <span id="stat-length">10m</span> | Hạ gục: <span id="stat-kills">0</span>
    </div>

    <div id="minimap-container" class="hud-panel">
        <canvas id="minimap"></canvas>
    </div>

    <!-- Mobile UI Controls -->
    <div id="mobile-controls">
        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>
        <div id="boost-btn">BOOST</div>
    </div>

    <!-- Start Screen Modal -->
    <div id="start-screen" class="modal-screen">
        <div class="modal-card">
            <h1>SNAKE.IO 3D</h1>
            <div class="input-group">
                <input type="text" id="player-name" placeholder="Nhập tên Rắn của bạn..." maxlength="12" value="Mãng Xà">
            </div>

            <p style="font-size:13px; color:#aaa; margin-bottom:10px;">Chọn Trang Phục:</p>
            <div class="skin-selector">
                <div class="skin-option active" data-skin="neon" style="background: linear-gradient(45deg, #00f0ff, #0055ff);"></div>
                <div class="skin-option" data-skin="fire" style="background: linear-gradient(45deg, #ff0055, #ffaa00);"></div>
                <div class="skin-option" data-skin="toxic" style="background: linear-gradient(45deg, #00ff66, #adff2f);"></div>
                <div class="skin-option" data-skin="royal" style="background: linear-gradient(45deg, #ff00ff, #7000ff);"></div>
                <div class="skin-option" data-skin="gold" style="background: linear-gradient(45deg, #ffe600, #ff8800);"></div>
            </div>

            <button class="btn-play" id="start-btn">BẮT ĐẦU CHIẾN</button>

            <div class="controls-hint">
                🖱️ Di chuyển chuột để đổi hướng<br>
                ⚡ Giữ chuột trái hoặc [SPACE] để Tăng Tốc<br>
                💥 Tạt đầu đối thủ để tiêu diệt chúng!
            </div>
        </div>
    </div>

    <!-- Game Over Screen Modal -->
    <div id="gameover-screen" class="modal-screen hidden">
        <div class="modal-card">
            <h1 style="background: linear-gradient(45deg, #ff0055, #ff5500); -webkit-background-clip: text;">BẠN ĐÃ HI SINH!</h1>
            <p style="font-size: 16px; margin-bottom: 8px;">Chiều dài đạt được: <span id="final-length" style="color:#00f0ff; font-weight:bold;">0m</span></p>
            <p style="font-size: 16px; margin-bottom: 20px;">Hạ gục đối thủ: <span id="final-kills" style="color:#ff0055; font-weight:bold;">0</span></p>

            <button class="btn-play" id="restart-btn">CHƠI LẠI NGAY</button>
        </div>
    </div>

    <script>
        // --- GAME CONFIG & CONSTANTS ---
        const WORLD_SIZE = 3600;
        const INITIAL_SNAKE_LENGTH = 18;
        const BASE_SPEED = 3.6;
        const BOOST_SPEED = 7.2;
        const FOOD_COUNT = 700;
        const AI_SNAKE_COUNT = 16;

        const SKINS = {
            neon: { head: '#00f0ff', body: ['#00f0ff', '#0088ff', '#0022aa'], glow: '#00f0ff' },
            fire: { head: '#ff0055', body: ['#ff0055', '#ff5500', '#ffaa00'], glow: '#ff5500' },
            toxic: { head: '#00ff66', body: ['#00ff66', '#aaff00', '#008833'], glow: '#00ff66' },
            royal: { head: '#d400ff', body: ['#d400ff', '#7700ff', '#3300aa'], glow: '#d400ff' },
            gold: { head: '#ffe600', body: ['#ffe600', '#ff9900', '#cc5500'], glow: '#ffe600' }
        };

        const AI_NAMES = [
            "Bạch Mộc", "Hắc Long", "Sát Thủ", "Rồng Đỏ", "Vua Rắn", 
            "Shadow", "Viper", "Anaconda", "Kobra", "Titan", 
            "Gia Tộc Rắn", "Bá Chủ", "Thần Rắn", "Xạ Thủ", "Mamba"
        ];

        // Canvas setup
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimap');
        const minimapCtx = minimapCanvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            minimapCanvas.width = 130;
            minimapCanvas.height = 130;
        }
        window.addEventListener('resize', resize);
        resize();

        // Audio Effects (Web Audio API)
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(freq, type, duration) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        // --- GAME STATE VARIABLES ---
        let isGameRunning = false;
        let player = null;
        let snakes = [];
        let foods = [];
        let particles = [];
        let camera = { x: 0, y: 0, zoom: 1 };
        let mousePos = { x: width / 2, y: height / 2 };
        let isBoosting = false;
        let selectedSkin = 'neon';

        // --- FOOD CLASS ---
        class Food {
            constructor(x, y, radius, isSuper = false, color = null) {
                this.x = x || Math.random() * (WORLD_SIZE - 200) + 100;
                this.y = y || Math.random() * (WORLD_SIZE - 200) + 100;
                this.radius = radius || (Math.random() * 2 + 3);
                this.isSuper = isSuper;
                this.color = color || `hsl(${Math.random() * 360}, 100%, 60%)`;
                this.pulse = Math.random() * Math.PI;
            }

            draw(ctx) {
                this.pulse += 0.05;
                const displayRadius = this.radius + (this.isSuper ? Math.sin(this.pulse) * 1.5 : 0);

                ctx.save();
                ctx.shadowBlur = this.isSuper ? 12 : 5;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, displayRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // --- PARTICLE CLASS ---
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6;
                this.color = color;
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.02;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // --- SNAKE CLASS ---
        class Snake {
            constructor(x, y, name, skinKey, isAI = false) {
                this.name = name;
                this.isAI = isAI;
                this.skin = SKINS[skinKey] || SKINS.neon;
                this.skinKey = skinKey;
                
                this.x = x;
                this.y = y;
                this.angle = Math.random() * Math.PI * 2;
                this.targetAngle = this.angle;
                this.speed = BASE_SPEED;
                this.isBoosting = false;

                this.score = 0;
                this.kills = 0;
                this.isDead = false;

                // Body segments
                this.body = [];
                this.targetLength = INITIAL_SNAKE_LENGTH;
                this.segmentDistance = 6;

                for (let i = 0; i < this.targetLength; i++) {
                    this.body.push({ x: this.x - i * this.segmentDistance * Math.cos(this.angle), y: this.y - i * this.segmentDistance * Math.sin(this.angle) });
                }

                // AI properties
                this.aiTimer = 0;
                this.aiTargetPos = null;
            }

            get radius() {
                return 12 + Math.sqrt(this.body.length) * 0.6;
            }

            update() {
                if (this.isDead) return;

                // Handle AI Steering
                if (this.isAI) {
                    this.updateAI();
                } else {
                    // Player Steering based on Mouse
                    const screenCenterX = width / 2;
                    const screenCenterY = height / 2;
                    const dx = mousePos.x - screenCenterX;
                    const dy = mousePos.y - screenCenterY;
                    if (Math.hypot(dx, dy) > 20) {
                        this.targetAngle = Math.atan2(dy, dx);
                    }
                    this.isBoosting = isBoosting && this.body.length > 12;
                }

                // Smooth rotation
                let diff = this.targetAngle - this.angle;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                this.angle += diff * 0.12;

                // Speed calculation
                this.speed = this.isBoosting ? BOOST_SPEED : BASE_SPEED;

                // Boost cost
                if (this.isBoosting && Math.random() < 0.3) {
                    if (this.body.length > 10) {
                        const tail = this.body[this.body.length - 1];
                        foods.push(new Food(tail.x, tail.y, 3, false, this.skin.head));
                        if (Math.random() < 0.2) this.body.pop();
                    }
                }

                // Move Head
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                // World boundaries collision
                const r = this.radius;
                if (this.x < r || this.x > WORLD_SIZE - r || this.y < r || this.y > WORLD_SIZE - r) {
                    this.die();
                    return;
                }

                // Update Body Segments
                this.body.unshift({ x: this.x, y: this.y });

                // Adjust body length
                while (this.body.length > this.targetLength) {
                    this.body.pop();
                }

                // Eat Foods
                this.checkFoodCollision();
            }

            updateAI() {
                this.aiTimer--;
                if (this.aiTimer <= 0) {
                    this.aiTimer = Math.floor(Math.random() * 40 + 20);

                    // Find nearest food or avoid other snakes
                    let nearestFood = null;
                    let minDist = 300;

                    for (let f of foods) {
                        let d = Math.hypot(f.x - this.x, f.y - this.y);
                        if (d < minDist) {
                            minDist = d;
                            nearestFood = f;
                        }
                    }

                    if (nearestFood) {
                        this.targetAngle = Math.atan2(nearestFood.y - this.y, nearestFood.x - this.x);
                    } else {
                        this.targetAngle += (Math.random() - 0.5) * 1.5;
                    }

                    // Avoid Boundaries
                    const margin = 200;
                    if (this.x < margin) this.targetAngle = 0;
                    if (this.x > WORLD_SIZE - margin) this.targetAngle = Math.PI;
                    if (this.y < margin) this.targetAngle = Math.PI / 2;
                    if (this.y > WORLD_SIZE - margin) this.targetAngle = -Math.PI / 2;

                    // AI Boost randomly
                    this.isBoosting = Math.random() < 0.15 && this.body.length > 25;
                }
            }

            checkFoodCollision() {
                const headRadius = this.radius;
                for (let i = foods.length - 1; i >= 0; i--) {
                    const f = foods[i];
                    const dist = Math.hypot(f.x - this.x, f.y - this.y);
                    if (dist < headRadius + f.radius) {
                        this.targetLength += f.isSuper ? 3 : 1;
                        this.score += f.isSuper ? 25 : 8;
                        foods.splice(i, 1);
                        if (!this.isAI) playSound(400 + Math.random() * 200, 'sine', 0.05);
                        
                        // Spawn new food if food count drops
                        if (foods.length < FOOD_COUNT) {
                            foods.push(new Food());
                        }
                    }
                }
            }

            die() {
                if (this.isDead) return;
                this.isDead = true;

                // Spawn food along the dead snake's body
                for (let i = 0; i < this.body.length; i += 2) {
                    const p = this.body[i];
                    foods.push(new Food(
                        p.x + (Math.random() - 0.5) * 10,
                        p.y + (Math.random() - 0.5) * 10,
                        Math.random() * 3 + 5,
                        true,
                        this.skin.body[i % this.skin.body.length]
                    ));
                    particles.push(new Particle(p.x, p.y, this.skin.head));
                }

                if (!this.isAI) {
                    playSound(150, 'sawtooth', 0.4);
                    showGameOver();
                }
            }

            draw(ctx) {
                if (this.isDead || this.body.length < 2) return;

                const radius = this.radius;

                // Draw Body Segments (Back to Front)
                for (let i = this.body.length - 1; i >= 0; i--) {
                    const p = this.body[i];
                    const colorIndex = Math.floor(i / 3) % this.skin.body.length;
                    const segmentRadius = Math.max(4, radius * (1 - (i / this.body.length) * 0.3));

                    ctx.save();
                    ctx.fillStyle = this.skin.body[colorIndex];
                    if (i === 0) {
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = this.skin.glow;
                    }
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, segmentRadius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                // Draw Eyes on Head
                const head = this.body[0];
                ctx.save();
                ctx.translate(head.x, head.y);
                ctx.rotate(this.angle);

                // Eyes
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(radius * 0.4, -radius * 0.4, radius * 0.35, 0, Math.PI * 2);
                ctx.arc(radius * 0.4, radius * 0.4, radius * 0.35, 0, Math.PI * 2);
                ctx.fill();

                // Pupils
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(radius * 0.5, -radius * 0.4, radius * 0.18, 0, Math.PI * 2);
                ctx.arc(radius * 0.5, radius * 0.4, radius * 0.18, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();

                // Draw Name Tag
                ctx.save();
                ctx.font = 'bold 12px Segoe UI';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.shadowBlur = 4;
                ctx.shadowColor = '#000';
                ctx.fillText(this.name, head.x, head.y - radius - 8);
                ctx.restore();
            }
        }

        // --- COLLISION SYSTEM ---
        function checkSnakeCollisions() {
            for (let s1 of snakes) {
                if (s1.isDead) continue;
                const head1 = s1.body[0];
                const r1 = s1.radius;

                for (let s2 of snakes) {
                    if (s2.isDead) continue;

                    // Check head-to-body collisions
                    const startIndex = (s1 === s2) ? 8 : 0; // Don't collide with own neck
                    for (let i = startIndex; i < s2.body.length; i++) {
                        const p2 = s2.body[i];
                        const dist = Math.hypot(head1.x - p2.x, head1.y - p2.y);

                        if (dist < r1 + s2.radius * 0.8) {
                            s1.die();
                            if (s1 !== s2) {
                                s2.kills++;
                                s2.targetLength += 10;
                            }
                            break;
                        }
                    }
                }
            }
        }

        // --- DRAW WORLD GRID ---
        function drawGrid(ctx) {
            const gridSize = 80;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
            ctx.lineWidth = 1;

            const startX = Math.max(0, Math.floor((camera.x - width / 2) / gridSize) * gridSize);
            const endX = Math.min(WORLD_SIZE, Math.ceil((camera.x + width / 2) / gridSize) * gridSize);
            const startY = Math.max(0, Math.floor((camera.y - height / 2) / gridSize) * gridSize);
            const endY = Math.min(WORLD_SIZE, Math.ceil((camera.y + height / 2) / gridSize) * gridSize);

            ctx.beginPath();
            for (let x = startX; x <= endX; x += gridSize) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, WORLD_SIZE);
            }
            for (let y = startY; y <= endY; y += gridSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(WORLD_SIZE, y);
            }
            ctx.stroke();

            // World Outer Boundary
            ctx.strokeStyle = '#ff0055';
            ctx.lineWidth = 8;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ff0055';
            ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);
            ctx.shadowBlur = 0;
        }

        // --- MINIMAP RENDER ---
        function drawMinimap() {
            minimapCtx.clearRect(0, 0, 130, 130);
            const scale = 130 / WORLD_SIZE;

            for (let s of snakes) {
                if (s.isDead) continue;
                minimapCtx.fillStyle = s === player ? '#00f0ff' : '#ff0055';
                minimapCtx.beginPath();
                minimapCtx.arc(s.x * scale, s.y * scale, s === player ? 3 : 2, 0, Math.PI * 2);
                minimapCtx.fill();
            }
        }

        // --- HUD & LEADERBOARD UPDATES ---
        function updateHUD() {
            if (!player) return;

            // Stats
            document.getElementById('stat-length').innerText = `${Math.floor(player.body.length)}m`;
            document.getElementById('stat-kills').innerText = player.kills;

            // Leaderboard Sorting
            const sortedSnakes = [...snakes].filter(s => !s.isDead).sort((a, b) => b.body.length - a.body.length);
            const listEl = document.getElementById('leaderboard-list');
            listEl.innerHTML = '';

            sortedSnakes.slice(0, 7).forEach((s, index) => {
                const li = document.createElement('li');
                if (s === player) li.className = 'me';
                li.innerHTML = `<span>${index + 1}. ${s.name}</span> <span>${Math.floor(s.body.length)}m</span>`;
                listEl.appendChild(li);
            });
        }

        // --- SPAWN AI SNAKES ---
        function maintainAISnakes() {
            const aliveAI = snakes.filter(s => s.isAI && !s.isDead).length;
            if (aliveAI < AI_SNAKE_COUNT) {
                const randomName = AI_NAMES[Math.floor(Math.random() * AI_NAMES.length)];
                const randomSkin = Object.keys(SKINS)[Math.floor(Math.random() * Object.keys(SKINS).length)];
                const x = Math.random() * (WORLD_SIZE - 400) + 200;
                const y = Math.random() * (WORLD_SIZE - 400) + 200;
                const ai = new Snake(x, y, randomName, randomSkin, true);
                ai.targetLength = INITIAL_SNAKE_LENGTH + Math.floor(Math.random() * 40);
                snakes.push(ai);
            }
        }

        // --- MAIN GAME LOOP ---
        function gameLoop() {
            ctx.clearRect(0, 0, width, height);

            if (isGameRunning && player) {
                // Update Entities
                snakes.forEach(s => s.update());
                checkSnakeCollisions();
                maintainAISnakes();

                // Clean Dead Snakes
                snakes = snakes.filter(s => !s.isDead);

                // Update Camera
                camera.x += (player.x - camera.x) * 0.1;
                camera.y += (player.y - camera.y) * 0.1;

                // Render World Transformation
                ctx.save();
                ctx.translate(width / 2 - camera.x, height / 2 - camera.y);

                drawGrid(ctx);

                // Draw Foods
                foods.forEach(f => f.draw(ctx));

                // Draw Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].draw(ctx);
                    if (particles[i].alpha <= 0) particles.splice(i, 1);
                }

                // Draw Snakes
                snakes.forEach(s => s.draw(ctx));

                ctx.restore();

                // Draw UI Overlays
                drawMinimap();
                updateHUD();
            }

            requestAnimationFrame(gameLoop);
        }

        // --- CONTROLS & EVENT LISTENERS ---
        window.addEventListener('mousemove', (e) => {
            mousePos.x = e.clientX;
            mousePos.y = e.clientY;
        });

        window.addEventListener('mousedown', (e) => {
            if (e.button === 0) isBoosting = true;
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 0) isBoosting = false;
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') isBoosting = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') isBoosting = false;
        });

        // Skin Selector UI Handler
        document.querySelectorAll('.skin-option').forEach(opt => {
            opt.addEventListener('click', () => {
                document.querySelectorAll('.skin-option').forEach(o => o.classList.remove('active'));
                opt.classList.add('active');
                selectedSkin = opt.getAttribute('data-skin');
            });
        });

        // Start & Restart Handlers
        function startGame() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }

            const nameInput = document.getElementById('player-name').value.trim() || 'Mãng Xà';
            
            // Reset World
            foods = [];
            snakes = [];
            particles = [];

            for (let i = 0; i < FOOD_COUNT; i++) {
                foods.push(new Food());
            }

            // Create Player
            const startX = WORLD_SIZE / 2;
            const startY = WORLD_SIZE / 2;
            player = new Snake(startX, startY, nameInput, selectedSkin, false);
            snakes.push(player);

            camera.x = startX;
            camera.y = startY;

            // Spawn Initial AI
            maintainAISnakes();

            // Hide Screens
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');

            isGameRunning = true;
        }

        function showGameOver() {
            document.getElementById('final-length').innerText = `${Math.floor(player.body.length)}m`;
            document.getElementById('final-kills').innerText = player.kills;
            document.getElementById('gameover-screen').classList.remove('hidden');
            isGameRunning = false;
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

        // Mobile Touch Joystick Controls
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        if (isMobile) {
            document.getElementById('mobile-controls').style.display = 'flex';
            
            const joystickZone = document.getElementById('joystick-zone');
            const joystickKnob = document.getElementById('joystick-knob');
            const boostBtn = document.getElementById('boost-btn');

            let touchStartX = 0;
            let touchStartY = 0;

            joystickZone.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                const rect = joystickZone.getBoundingClientRect();
                touchStartX = rect.left + rect.width / 2;
                touchStartY = rect.top + rect.height / 2;
            });

            joystickZone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const dx = touch.clientX - touchStartX;
                const dy = touch.clientY - touchStartY;
                const dist = Math.min(40, Math.hypot(dx, dy));
                const angle = Math.atan2(dy, dx);

                joystickKnob.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;

                mousePos.x = width / 2 + Math.cos(angle) * 100;
                mousePos.y = height / 2 + Math.sin(angle) * 100;
            });

            joystickZone.addEventListener('touchend', () => {
                joystickKnob.style.transform = 'translate(0px, 0px)';
            });

            boostBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isBoosting = true; });
            boostBtn.addEventListener('touchend', (e) => { e.preventDefault(); isBoosting = false; });
        }

        // Start Loop
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
