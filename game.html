<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Pixel Shooter Deluxe</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #020408; color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }
        .container {
            position: relative;
            width: 400px; height: 520px;
            border: 2px solid #00f0ff; border-radius: 20px;
            background: radial-gradient(circle at center, #0a1128 0%, #020408 100%);
            box-shadow: 0 0 35px rgba(0,240,255,0.3);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .hud {
            position: absolute; top: 12px; left: 16px; right: 16px;
            display: flex; justify-content: space-between;
            font-size: 15px; font-weight: bold; z-index: 5;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
        }
        canvas { outline: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="hud">
        <div>Điểm: <span id="score" style="color: #00f0ff; text-shadow: 0 0 10px rgba(0,240,255,0.8);">0</span></div>
        <div>Mạng: <span id="lives" style="color: #ff3366;">❤️❤️❤️</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="520" tabindex="1"></canvas>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const livesElement = document.getElementById("lives");

    // Trạng thái game: 'menu' | 'difficulty' | 'playing' | 'gameover'
    let gameState = 'menu';
    let score = 0, lives = 3, difficulty = 'normal';
    let player = { x: 175, y: 410, width: 48, height: 48, speed: 6.5, dx: 0 };
    let bullets = [], enemies = [], stars = [], particles = [], enemyBullets = [], enemyDirection = 1;

    for(let i=0; i<80; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 0.5,
            speed: Math.random() * 2 + 0.5,
            alpha: Math.random() * 0.8 + 0.2
        });
    }

    function createEnemies() {
        enemies = [];
        let rows = (difficulty === 'easy') ? 2 : (difficulty === 'normal' ? 3 : 4);
        let cols = 5, startX = 45, startY = 60, spacingX = 64, spacingY = 52;
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                enemies.push({ x: startX + c * spacingX, y: startY + r * spacingY, width: 42, height: 38, alive: true, anim: Math.random() * Math.PI });
            }
        }
    }

    function startGame(selectedDiff) {
        difficulty = selectedDiff;
        gameState = 'playing';
        score = 0; lives = (difficulty === 'hard') ? 2 : 3; 
        bullets = []; enemyBullets = []; particles = []; player.x = 175;
        scoreElement.textContent = score; 
        updateLivesDisplay(); 
        createEnemies();
        canvas.focus();
    }

    function updateLivesDisplay() {
        let hearts = "";
        for(let i=0; i<lives; i++) hearts += "❤️";
        livesElement.textContent = hearts;
    }

    function addExplosion(x, y, color) {
        for(let i=0; i<14; i++) {
            let angle = Math.random() * Math.PI * 2;
            let speed = Math.random() * 3.5 + 1;
            particles.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                radius: Math.random() * 3 + 1,
                color: color,
                alpha: 1,
                decay: Math.random() * 0.03 + 0.02
            });
        }
    }

    // Xử lý sự kiện bấm chuột trực tiếp trên Canvas (Không bao giờ lo bị kẹt nút)
    canvas.addEventListener("click", (e) => {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        if (gameState === 'menu') {
            // Nút PLAY (Vùng x: 100->300, y: 280->330)
            if (mouseX >= 100 && mouseX <= 300 && mouseY >= 280 && mouseY <= 330) {
                gameState = 'difficulty';
            }
        } else if (gameState === 'difficulty') {
            // Nút EASY (y: 220->265)
            if (mouseX >= 100 && mouseX <= 300 && mouseY >= 220 && mouseY <= 265) {
                startGame('easy');
            }
            // Nút NORMAL (y: 285->330)
            else if (mouseX >= 100 && mouseX <= 300 && mouseY >= 285 && mouseY <= 330) {
                startGame('normal');
            }
            // Nút HARD (y: 350->395)
            else if (mouseX >= 100 && mouseX <= 300 && mouseY >= 350 && mouseY <= 395) {
                startGame('hard');
            }
        } else if (gameState === 'gameover') {
            // Nút CHƠI LẠI (y: 310->360)
            if (mouseX >= 100 && mouseX <= 300 && mouseY >= 310 && mouseY <= 360) {
                gameState = 'menu';
            }
        }
    });

    // Main Game Loop chạy 60 FPS
    setInterval(() => {
        update();
        draw();
    }, 1000 / 60);

    function update() {
        if (gameState !== 'playing') return;

        player.x += player.dx;
        if (player.x < 0) player.x = 0;
        if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].y -= 14;
            if (bullets[i].y < 0) bullets.splice(i, 1);
        }

        if (difficulty === 'hard') {
            if (Math.random() < 0.04) {
                let activeEnemies = enemies.filter(e => e.alive);
                if (activeEnemies.length > 0) {
                    let shooter = activeEnemies[Math.floor(Math.random() * activeEnemies.length)];
                    enemyBullets.push({ x: shooter.x + shooter.width/2, y: shooter.y + shooter.height });
                }
            }
        }

        for (let i = enemyBullets.length - 1; i >= 0; i--) {
            enemyBullets[i].y += 5;
            if (enemyBullets[i].x > player.x && enemyBullets[i].x < player.x + player.width &&
                enemyBullets[i].y > player.y && enemyBullets[i].y < player.y + player.height) {
                enemyBullets.splice(i, 1);
                lives--;
                updateLivesDisplay();
                addExplosion(player.x + player.width/2, player.y + player.height/2, "#ff3366");
                if (lives <= 0) endGame();
            } else if (enemyBullets[i].y > canvas.height) {
                enemyBullets.splice(i, 1);
            }
        }

        let hitEdge = false, aliveCount = 0;
        let enemySpeed = difficulty === 'easy' ? 0.8 : (difficulty === 'normal' ? 1.1 : 1.5);
        
        enemies.forEach(e => {
            if (!e.alive) return;
            aliveCount++;
            e.x += enemySpeed * enemyDirection;
            e.anim += 0.08;
            if (e.x <= 15 || e.x + e.width >= canvas.width - 15) hitEdge = true;
        });

        if (hitEdge) {
            enemyDirection *= -1;
            enemies.forEach(e => {
                e.y += 14;
                if (e.y + e.height >= player.y) endGame();
            });
        }

        if (aliveCount === 0) createEnemies();

        for (let i = bullets.length - 1; i >= 0; i--) {
            let bulletHit = false;
            for (let j = 0; j < enemies.length; j++) {
                let e = enemies[j];
                if (e.alive && bullets[i].x > e.x && bullets[i].x < e.x + e.width && bullets[i].y > e.y && bullets[i].y < e.y + e.height) {
                    e.alive = false; bulletHit = true; score += 20; scoreElement.textContent = score;
                    addExplosion(e.x + e.width/2, e.y + e.height/2, "#ff007f");
                    break;
                }
            }
            if (bulletHit) bullets.splice(i, 1);
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].x += particles[i].vx;
            particles[i].y += particles[i].vy;
            particles[i].alpha -= particles[i].decay;
            if (particles[i].alpha <= 0) particles.splice(i, 1);
        }

        stars.forEach(star => {
            star.y += star.speed;
