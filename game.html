<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Pixel Shooter Deluxe</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #020408; color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }
        .container {
            position: relative;
            width: 400px; height: 520px;
            border: 2px solid #00f0ff; border-radius: 20px;
            background: radial-gradient(circle at center, #0a1128 0%, #020408 100%);
            box-shadow: 0 0 35px rgba(0,240,255,0.3);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .hud {
            position: absolute; top: 12px; left: 16px; right: 16px;
            display: flex; justify-content: space-between;
            font-size: 14px; font-weight: bold; z-index: 5;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
        }
        canvas { outline: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="hud">
        <div>Điểm: <span id="score" style="color: #00f0ff;">0</span></div>
        <div id="stageIndicator" style="color: #ffb703;">GIAI ĐOẠN 1</div>
        <div>Mạng: <span id="lives" style="color: #ff3366;">❤️❤️❤️</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="520" tabindex="1"></canvas>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const livesElement = document.getElementById("lives");
    const stageIndicator = document.getElementById("stageIndicator");

    let gameState = 'menu';
    let score = 0, lives = 3, difficulty = 'normal', currentStage = 1;
    let player = { x: 175, y: 440, width: 48, height: 48, speed: 6.5, dx: 0 };
    let bullets = [], enemies = [], stars = [], particles = [], enemyBullets = [], boss = null;

    for(let i=0; i<80; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 0.5,
            speed: Math.random() * 2 + 0.5,
            alpha: Math.random() * 0.8 + 0.2
        });
    }

    function initStage() {
        enemies = [];
        boss = null;
        if (currentStage === 1) {
            stageIndicator.textContent = "GIAI ĐOẠN 1 (5 QUÁI)";
            // Tạo 5 con alien di chuyển tự do
            for (let i = 0; i < 5; i++) {
                enemies.push(createFreeAlien());
            }
        } else if (currentStage === 2) {
            stageIndicator.textContent = "GIAI ĐOẠN 2 (10 QUÁI)";
            // Tạo 10 con alien di chuyển tự do
            for (let i = 0; i < 10; i++) {
                enemies.push(createFreeAlien());
            }
        } else if (currentStage === 3) {
            stageIndicator.textContent = "FINAL BOSS 👾";
            // Tạo Boss cuối
            boss = {
                x: 160,
                y: 60,
                width: 80,
                height: 60,
                hp: 30,
                maxHp: 30,
                dx: 1.5,
                anim: 0
            };
        }
    }

    function createFreeAlien() {
        return {
            x: Math.random() * (canvas.width - 60) + 30,
            y: Math.random() * 120 + 40,
            vx: (Math.random() - 0.5) * 2.5,
            vy: (Math.random() - 0.2) * 1.5 + 0.5,
            width: 42,
            height: 38,
            alive: true,
            anim: Math.random() * Math.PI * 2
        };
    }

    function startGame(selectedDiff) {
        difficulty = selectedDiff;
        gameState = 'playing';
        score = 0; 
        lives = (difficulty === 'hard') ? 2 : 3; 
        currentStage = 1;
        bullets = []; enemyBullets = []; particles = []; player.x = 175;
        scoreElement.textContent = score; 
        updateLivesDisplay(); 
        initStage();
        canvas.focus();
    }

    function updateLivesDisplay() {
        let hearts = "";
        for(let i=0; i<lives; i++) hearts += "❤️";
        livesElement.textContent = hearts;
    }

    function addExplosion(x, y, color) {
        for(let i=0; i<14; i++) {
            let angle = Math.random() * Math.PI * 2;
            let speed = Math.random() * 3.5 + 1;
            particles.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                radius: Math.random() * 3 + 1,
                color: color,
                alpha: 1,
                decay: Math.random() * 0.03 + 0.02
            });
        }
    }

    canvas.addEventListener("click", (e) => {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        if (gameState === 'menu') {
            if (mouseX >= 100 && mouseX <= 300 && mouseY >= 280 && mouseY <= 330) {
                gameState = 'difficulty';
            }
        } else if (gameState === 'difficulty') {
            if (mouseX >= 100 && mouseX <= 300 && mouseY >= 220 && mouseY <= 265) startGame('easy');
            else if (mouseX >= 100 && mouseX <= 300 && mouseY >= 285 && mouseY <= 330) startGame('normal');
            else if (mouseX >= 100 && mouseX <= 300 && mouseY >= 350 && mouseY <= 395) startGame('hard');
        } else if (gameState === 'gameover' || gameState === 'victory') {
            if (mouseX >= 100 && mouseX <= 300 && mouseY >= 310 && mouseY <= 360) gameState = 'menu';
        }
    });

    setInterval(() => {
        update();
        draw();
    }, 1000 / 60);

    function update() {
        if (gameState !== 'playing') return;

        player.x += player.dx;
        if (player.x < 0) player.x = 0;
        if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

        // Đạn người chơi
        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].y -= 10;
            if (bullets[i].y < 0) bullets.splice(i, 1);
        }

        // --- XỬ LÝ GIAI ĐOẠN 1 & 2 (QUÁI BAY TỰ DO) ---
        if (currentStage === 1 || currentStage === 2) {
            let shootChance = currentStage === 1 ? 0.015 : 0.03;
            if (Math.random() < shootChance) {
                let activeEnemies = enemies.filter(e => e.alive);
                if (activeEnemies.length > 0) {
                    let shooter = activeEnemies[Math.floor(Math.random() * activeEnemies.length)];
                    enemyBullets.push({ x: shooter.x + shooter.width/2, y: shooter.y + shooter.height, speed: 4 });
                }
            }

            let aliveCount = 0;
            enemies.forEach(e => {
                if (!e.alive) return;
                aliveCount++;
                
                // Di chuyển tự do lượn lách
                e.x += e.vx;
                e.y += e.vy;
                e.anim += 0.05;

                // Va đập biên ngang
                if (e.x <= 10 || e.x + e.width >= canvas.width - 10) e.vx *= -1;
                // Giới hạn biên dọc ở phần trên
                if (e.y <= 30 || e.y >= 300) e.vy *= -1;

                // Nếu lọt qua sau lưng người chơi
                if (e.y > player.y) {
                    e.alive = false;
                    lives--;
                    updateLivesDisplay();
                    addExplosion(e.x + e.width/2, e.y, "#ff3366");
                    if (lives <= 0) endGame();
                }
            });

            // Kiểm tra hoàn thành stage
            if (aliveCount === 0) {
                currentStage++;
                initStage();
            }
        } 
        // --- XỬ LÝ GIAI ĐOẠN CUỐI (BOSS STAGE) ---
        else if (currentStage === 3 && boss) {
            boss.x += boss.dx;
            boss.anim += 0.05;
            if (boss.x <= 15 || boss.x + boss.width >= canvas.width - 15) boss.dx *= -1;

            // Boss bắn đạn chùm
            if (Math.random() < 0.04) {
                enemyBullets.push({ x: boss.x + 20, y: boss.y + boss.height, speed: 5 });
                enemyBullets.push({ x: boss.x + boss.width / 2, y: boss.y + boss.height, speed: 5.5 });
                enemyBullets.push({ x: boss.x + boss.width - 20, y: boss.y + boss.height, speed: 5 });
            }
        }

        // Cập nhật đạn địch bay xuống
        for (let i = enemyBullets.length - 1; i >= 0; i--) {
            enemyBullets[i].y += enemyBullets[i].speed;
            if (enemyBullets[i].x > player.x && enemyBullets[i].x < player.x + player.width &&
                enemyBullets[i].y > player.y && enemyBullets[i].y < player.y + player.height) {
                enemyBullets.splice(i, 1);
                lives--;
                updateLivesDisplay();
                addExplosion(player.x + player.width/2, player.y + player.height/2, "#ff3366");
                if (lives <= 0) endGame();
            } else if (enemyBullets[i].y > canvas.height) {
                enemyBullets.splice(i, 1);
            }
        }

        // Va chạm đạn người chơi với quái thường
        for (let i = bullets.length - 1; i >= 0; i--) {
            let bulletHit = false;
            
            // Đánh quái thường
            for (let j = 0; j < enemies.length; j++) {
                let e = enemies[j];
                if (e.alive && bullets[i].x > e.x && bullets[i].x < e.x + e.width && bullets[i].y > e.y && bullets[i].y < e.y + e.height) {
                    e.alive = false; bulletHit = true; score += 20; scoreElement.textContent = score;
                    addExplosion(e.x + e.width/2, e.y + e.height/2, "#ff007f");
                    break;
                }
            }

            // Đánh Boss
            if (!bulletHit && boss && bullets[i].x > boss.x && bullets[i].x < boss.x + boss.width && bullets[i].y > boss.y && bullets[i].y < boss.y + boss.height) {
                bulletHit = true;
                boss.hp--;
                addExplosion(bullets[i].x, bullets[i].y, "#00f0ff");
                if (boss.hp <= 0) {
                    addExplosion(boss.x + boss.width/2, boss.y + boss.height/2, "#ff3366");
                    score += 500;
                    scoreElement.textContent = score;
                    gameState = 'victory';
                }
            }

            if (bulletHit) bullets.splice(i, 1);
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].x += particles[i].vx;
            particles[i].y += particles[i].vy;
            particles[i].alpha -= particles[i].decay;
            if (particles[i].alpha <= 0) particles.splice(i, 1);
        }

        stars.forEach(star => {
            star.y += star.speed;
            if (star.y > canvas.height) star.y = 0;
        });
    }

    function draw() {
        ctx.fillStyle = "#020408";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        stars.forEach(star => {
            ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
            ctx.fillRect(star.x, star.y, star.size, star.size);
        });

        particles.forEach(p => {
            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });

        if (gameState === 'playing') {
            // Đạn người chơi
            ctx.save();
            ctx.shadowBlur = 12;
            ctx.shadowColor = "#00f0ff";
            ctx.fillStyle = "#00f0ff";
            bullets.forEach(b => { ctx.fillRect(b.x - 2, b.y, 4, 12); });
            ctx.restore();

            // Đạn địch
            ctx.save();
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#ff3366";
            ctx.fillStyle = "#ff3366";
            enemyBullets.forEach(eb => { ctx.fillRect(eb.x - 2, eb.y, 4, 10); });
            ctx.restore();

            // Tàu Player
            let px = player.x, py = player.y, s = 1.5;
            ctx.save();
            ctx.shadowBlur = 18;
            ctx.shadowColor = "#ff5500";
            ctx.fillStyle = "#ff5500";
            let flameHeight = (6 + Math.random() * 8) * s;
            ctx.fillRect(px + 12*s, py + 29*s, 2*s, flameHeight);
            ctx.fillRect(px + 18*s, py + 29*s, 2*s, flameHeight);
            ctx.restore();

            ctx.fillStyle = "#ff5500";
            ctx.fillRect(px + 12*s, py + 25*s, 2*s, 4*s);
            ctx.fillRect(px + 18*s, py + 25*s, 2*s, 4*s);
            ctx.fillStyle = "#ff0055";
            ctx.fillRect(px + 11*s, py + 23*s, 3*s, 2*s);
            ctx.fillRect(px + 18*s, py + 23*s, 3*s, 2*s);

            ctx.fillStyle = "#00ffff";
            ctx.fillRect(px + 15*s, py + 1*s, 2*s, 3*s);
            ctx.fillStyle = "#00b4d8";
            ctx.fillRect(px + 14*s, py + 4*s, 4*s, 3*s);
            ctx.fillStyle = "#0077b6";
            ctx.fillRect(px + 13*s, py + 7*s, 6*s, 5*s);
            ctx.fillStyle = "#03045e";
            ctx.fillRect(px + 12*s, py + 12*s, 8*s, 7*s);
            ctx.fillStyle = "#00b4d8";
            ctx.fillRect(px + 13*s, py + 13*s, 6*s, 5*s);

            ctx.save();
            ctx.shadowBlur = 12;
            ctx.shadowColor = "#ffb703";
            ctx.fillStyle = "#ffb703";
            ctx.fillRect(px + 15*s, py + 6*s, 2*s, 4*s);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(px + 15*s, py + 7*s, 1*s, 2*s);
            ctx.restore();

            ctx.fillStyle = "#ff007f";
            ctx.fillRect(px + 9*s, py + 13*s, 3*s, 4*s);
            ctx.fillRect(px + 6*s, py + 15*s, 3*s, 4*s);
            ctx.fillStyle = "#7209b7";
            ctx.fillRect(px + 3*s, py + 17*s, 3*s, 4*s);
            ctx.fillStyle = "#ff5500";
            ctx.fillRect(px + 2*s, py + 21*s, 2*s, 3*s);

            ctx.fillStyle = "#ff007f";
            ctx.fillRect(px + 20*s, py + 13*s, 3*s, 4*s);
            ctx.fillRect(px + 23*s, py + 15*s, 3*s, 4*s);
            ctx.fillStyle = "#7209b7";
            ctx.fillRect(px + 26*s, py + 17*s, 3*s, 4*s);
            ctx.fillStyle = "#ff5500";
            ctx.fillRect(px + 28*s, py + 21*s, 2*s, 3*s);

            ctx.save();
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#00f0ff";
            ctx.fillStyle = "#00f0ff";
            ctx.fillRect(px + 3*s, py + 14*s, 2*s, 4*s);
            ctx.fillRect(px + 27*s, py + 14*s, 2*s, 4*s);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(px + 3*s, py + 13*s, 2*s, 1*s);
            ctx.fillRect(px + 27*s, py + 13*s, 2*s, 1*s);
            ctx.restore();

            ctx.fillStyle = "#90e0ef";
            ctx.fillRect(px + 11*s, py + 19*s, 1*s, 5*s);
            ctx.fillRect(px + 20*s, py + 19*s, 1*s, 5*s);

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(px + 15*s, py + 2*s, 1*s, 1*s);
            ctx.fillStyle = "#90e0ef";
            ctx.fillRect(px + 14*s, py + 9*s, 1*s, 2*s);
            ctx.fillRect(px + 17*s, py + 9*s, 1*s, 2*s);

            // Vẽ quái thường (Stage 1 & 2)
            if (currentStage === 1 || currentStage === 2) {
                enemies.forEach(e => {
                    if (!e.alive) return;
                    let ex = e.x, ey = e.y, es = 1.6;

                    ctx.fillStyle = "#ff007f";
                    ctx.fillRect(ex + 2*es, ey + 6*es, 4*es, 4*es);
                    ctx.fillRect(ex - 2*es, ey + 4*es, 4*es, 3*es);
                    ctx.fillRect(ex + 15*es, ey + 6*es, 4*es, 4*es);
                    ctx.fillRect(ex + 19*es, ey + 4*es, 4*es, 3*es);

                    ctx.fillStyle = "#560bad";
                    ctx.fillRect(ex + 5*es, ey + 4*es, 11*es, 11*es);
                    ctx.fillStyle = "#7209b7";
                    ctx.fillRect(ex + 6*es, ey + 5*es, 9*es, 9*es);

                    ctx.fillStyle = "#f77f00";
                    ctx.fillRect(ex + 7*es, ey + 2*es, 7*es, 4*es);
                    ctx.fillStyle = "#fcbf49";
                    ctx.fillRect(ex + 9*es, ey + 1*es, 3*es, 2*es);

                    ctx.save();
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "#ff0055";
                    ctx.fillStyle = "#ff0055";
                    ctx.fillRect(ex + 7*es, ey + 6*es, 2*es, 3*es);
                    ctx.fillRect(ex + 12*es, ey + 6*es, 2*es, 3*es);
                    ctx.restore();

                    ctx.fillStyle = "#4cc9f0";
                    ctx.fillRect(ex + 1*es, ey + 9*es, 3*es, 2*es);
                    ctx.fillRect(ex + 17*es, ey + 9*es, 3*es, 2*es);
                });
            } 
            // Vẽ Boss (Stage 3)
            else if (currentStage === 3 && boss) {
                let bx = boss.x, by = boss.y;
                let bs = 2.2;
                
                ctx.save();
                ctx.shadowBlur = 20;
                ctx.shadowColor = "#ff3366";
                ctx.fillStyle = "#b5179e";
                ctx.fillRect(bx + 5*bs, by + 4*bs, 26*bs, 18*bs);
                ctx.fillStyle = "#7209b7";
                ctx.fillRect(bx + 8*bs, by + 6*bs, 20*bs, 14*bs);

                // Mắt Boss phát sáng đỏ
                ctx.fillStyle = "#ff0055";
                ctx.fillRect(bx + 11*bs, by + 10*bs, 4*bs, 5*bs);
                ctx.fillRect(bx + 21*bs, by + 10*bs, 4*bs, 5*bs);
                ctx.restore();

                // Thanh máu Boss
                ctx.fillStyle = "#333";
                ctx.fillRect(bx, by - 12, boss.width, 6);
                ctx.fillStyle = "#ff3366";
                ctx.fillRect(bx, by - 12, boss.width * (boss.hp / boss.maxHp), 6);
            }
        } 
        else if (gameState === 'menu') {
            ctx.fillStyle = "rgba(2, 4, 8, 0.95)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#00f0ff";
            ctx.font = "bold 24px 'Plus Jakarta Sans'";
            ctx.textAlign = "center";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#00f0ff";
            ctx.fillText("⚡ GALAXY PIXEL STRIKE 🚀", canvas.width / 2, 180);
            ctx.shadowBlur = 0;

            ctx.fillStyle = "#8892b0";
            ctx.font = "12px 'Plus Jakarta Sans'";
            ctx.fillText("Dùng Mũi tên/A-D di chuyển • Phím Cách bắn Đạn", canvas.width / 2, 220);

            ctx.fillStyle = "#00f0ff";
            ctx.fillRect(100, 280, 200, 50);
            ctx.fillStyle = "#020408";
            ctx.font = "bold 18px 'Plus Jakarta Sans'";
            ctx.fillText("PLAY ▶", canvas.width / 2, 312);
        }
        else if (gameState === 'difficulty') {
            ctx.fillStyle = "rgba(2, 4, 8, 0.96)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#00f0ff";
            ctx.font = "bold 22px 'Plus Jakarta Sans'";
            ctx.textAlign = "center";
            ctx.fillText("CHỌN ĐỘ KHÓ", canvas.width / 2, 140);
            
            ctx.fillStyle = "#8892b0";
            ctx.font = "13px 'Plus Jakarta Sans'";
            ctx.fillText("SELECT DIFFICULTY", canvas.width / 2, 168);

            ctx.fillStyle = "#06d6a0";
            ctx.fillRect(100, 220, 200, 45);
            ctx.fillStyle = "#020408";
            ctx.font = "bold 16px 'Plus Jakarta Sans'";
            ctx.fillText("EASY", canvas.width / 2, 248);

            ctx.fillStyle = "#ffb703";
            ctx.fillRect(100, 285, 200, 45);
            ctx.fillStyle = "#020408";
            ctx.fillText("NORMAL", canvas.width / 2, 313);

            ctx.fillStyle = "#ff3366";
            ctx.fillRect(100, 350, 200, 45);
            ctx.fillStyle = "#fff";
            ctx.fillText("HARD", canvas.width / 2, 378);
        }
        else if (gameState === 'gameover' || gameState === 'victory') {
            ctx.fillStyle = "rgba(2, 4, 8, 0.96)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = gameState === 'victory' ? "#06d6a0" : "#ff3366";
            ctx.font = "bold 24px 'Plus Jakarta Sans'";
            ctx.textAlign = "center";
            ctx.shadowBlur = 15;
            ctx.shadowColor = ctx.fillStyle;
            ctx.fillText(gameState === 'victory' ? "CHIẾN THẮNG! 🏆" : "TRÒ CHƠI KẾT THÚ 💀", canvas.width / 2, 180);
            ctx.shadowBlur = 0;

            ctx.fillStyle = "#fff";
            ctx.font = "16px 'Plus Jakarta Sans'";
            ctx.fillText("Tổng điểm: " + score, canvas.width / 2, 230);

            ctx.fillStyle = "#00f0ff";
            ctx.fillRect(100, 310, 200, 50);
            ctx.fillStyle = "#020408";
            ctx.font = "bold 16px 'Plus Jakarta Sans'";
            ctx.fillText("CHƠI LẠI 🔄", canvas.width / 2, 342);
        }
    }

    function endGame() {
        gameState = 'gameover';
    }

    window.addEventListener("keydown", (e) => {
        if (gameState !== 'playing') return;
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") player.dx = -player.speed;
        if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") player.dx = player.speed;
        if (e.key === " " || e.key === "ArrowUp") {
            bullets.push({ x: player.x + player.width / 2, y: player.y });
            e.preventDefault();
        }
    });

    window.addEventListener("keyup", (e) => {
        if ((e.key === "ArrowLeft" || e.key === "a" || e.key === "A") && player.dx < 0) player.dx = 0;
        if ((e.key === "ArrowRight" || e.key === "d" || e.key === "D") && player.dx > 0) player.dx = 0;
    });

    canvas.addEventListener("click", () => { canvas.focus(); });
</script>

</body>
</html>
