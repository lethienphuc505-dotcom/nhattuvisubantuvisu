<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #1a1c29; color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }
        .container {
            position: relative;
            width: 400px; height: 520px;
            border: 2px solid rgba(255,255,255,0.1); border-radius: 20px;
            background: linear-gradient(135deg, #2b2d42, #11131a);
            box-shadow: 0 12px 35px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .menu-screen {
            position: absolute; width: 100%; height: 100%;
            background: rgba(26, 28, 41, 0.92);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; transition: opacity 0.3s ease;
        }
        .menu-screen.hidden { opacity: 0; pointer-events: none; }
        h1 { color: #ffb703; font-size: 26px; margin-bottom: 5px; text-shadow: 0 2px 5px rgba(0,0,0,0.4); text-align: center; }
        .subtitle { color: #8d99ae; font-size: 13px; margin-bottom: 25px; text-align: center; }
        
        .menu-btn {
            width: 200px; padding: 12px 0; margin: 8px 0;
            font-size: 16px; font-weight: 800;
            background: linear-gradient(135deg, #fb8500, #ffb703);
            color: #1a1c29; border: none; border-radius: 14px;
            cursor: pointer; box-shadow: 0 6px 20px rgba(251,133,0,0.4);
            transition: transform 0.1s, filter 0.2s;
        }
        .menu-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .menu-btn:active { transform: scale(0.95); }

        .hud {
            position: absolute; top: 15px; left: 20px; right: 20px;
            display: flex; justify-content: space-between;
            font-size: 18px; font-weight: bold; z-index: 5;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }
        canvas { outline: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="menu-screen" id="menuScreen">
        <h1>🐱 FLAPPY CAT 🌸</h1>
        <div class="subtitle">Nhấn Phím Cách hoặc Click để bay lên!</div>
        <button class="menu-btn" onclick="startGame()">CHƠI NGAY ▶</button>
    </div>

    <div class="hud">
        <div>Điểm: <span id="score" style="color: #ffb703;">0</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="520" tabindex="1"></canvas>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const menuScreen = document.getElementById("menuScreen");

    let score = 0;
    let isPlaying = false;
    let gameInterval = null;

    let cat = {
        x: 80,
        y: 240,
        width: 36,
        height: 30,
        gravity: 0.5,
        lift: -8.5,
        velocity: 0
    };

    let pipes = [];
    let frameCount = 0;

    function startGame() {
        menuScreen.classList.add("hidden");
        isPlaying = true;
        score = 0;
        cat.y = 240;
        cat.velocity = 0;
        pipes = [];
        frameCount = 0;
        scoreElement.textContent = score;
        
        canvas.focus();

        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, 1000 / 60);
    }

    function gameLoop() {
        update();
        draw();
    }

    function update() {
        // Trọng lực kéo mèo rơi xuống
        cat.velocity += cat.gravity;
        cat.y += cat.velocity;

        // Chạm đất hoặc bay quá trần nhà -> Thua
        if (cat.y + cat.height >= canvas.height || cat.y <= 0) {
            endGame();
        }

        // Tạo ống cống mới định kỳ
        if (frameCount % 90 === 0) {
            let minHeight = 60;
            let maxHeight = 240;
            let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
            let gap = 130; // Khoảng trống giữa ống trên và ống dưới

            pipes.push({
                x: canvas.width,
                top: topHeight,
                bottom: canvas.height - topHeight - gap,
                width: 55,
                passed: false
            });
        }

        // Cập nhật vị trí các ống cống
        for (let i = pipes.length - 1; i >= 0; i--) {
            pipes[i].x -= 2.8;

            // Kiểm tra va chạm với mèo
            if (
                cat.x < pipes[i].x + pipes[i].width &&
                cat.x + cat.width > pipes[i].x &&
                (cat.y < pipes[i].top || cat.y + cat.height > canvas.height - pipes[i].bottom)
            ) {
                endGame();
            }

            // Cộng điểm khi vượt qua ống
            if (!pipes[i].passed && pipes[i].x + pipes[i].width < cat.x) {
                score += 10;
                scoreElement.textContent = score;
                pipes[i].passed = true;
            }

            // Xóa ống khi ra khỏi màn hình
            if (pipes[i].x + pipes[i].width < 0) {
                pipes.splice(i, 1);
            }
        }

        frameCount++;
    }

    function draw() {
        // Nền trời
        ctx.fillStyle = "#212538";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Vẽ các ống cống phong cách dễ thương (Màu xanh mint)
        pipes.forEach(p => {
            ctx.fillStyle = "#48bfe3";
            // Ống trên
            ctx.fillRect(p.x, 0, p.width, p.top);
            ctx.fillStyle = "#56cfe1";
            ctx.fillRect(p.x - 4, p.top - 16, p.width + 8, 16);

            // Ống dưới
            ctx.fillStyle = "#48bfe3";
            ctx.fillRect(p.x, canvas.height - p.bottom, p.width, p.bottom);
            ctx.fillStyle = "#56cfe1";
            ctx.fillRect(p.x - 4, canvas.height - p.bottom, p.width + 8, 16);
        });

        // --- VẼ CHÚ MÈO 3D/HOẠT HÌNH ---
        let cx = cat.x;
        let cy = cat.y;

        // Thân mèo màu vàng cam ấm áp
        ctx.fillStyle = "#ffb703";
        ctx.beginPath();
        ctx.ellipse(cx + 18, cy + 15, 18, 15, 0, 0, Math.PI * 2);
        ctx.fill();

        // Tai mèo nhọn xinh xắn
        ctx.beginPath();
        ctx.moveTo(cx + 4, cy + 5);
        ctx.lineTo(cx + 2, cy - 8);
        ctx.lineTo(cx + 14, cy + 2);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(cx + 32, cy + 5);
        ctx.lineTo(cx + 34, cy - 8);
        ctx.lineTo(cx + 22, cy + 2);
        ctx.fill();

        // Má hồng phúng phính
        ctx.fillStyle = "#ff5964";
        ctx.beginPath();
        ctx.arc(cx + 8, cy + 18, 4, 0, Math.PI * 2);
        ctx.arc(cx + 28, cy + 18, 4, 0, Math.PI * 2);
        ctx.fill();

        // Mắt mèo tròn đen bóng
        ctx.fillStyle = "#1a1c29";
        ctx.beginPath();
        ctx.arc(cx + 12, cy + 12, 3, 0, Math.PI * 2);
        ctx.arc(cx + 24, cy + 12, 3, 0, Math.PI * 2);
        ctx.fill();
    }

    function jump() {
        if (!isPlaying) return;
        cat.velocity = cat.lift;
    }

    function endGame() {
        isPlaying = false;
        clearInterval(gameInterval);
        
        menuScreen.querySelector("h1").textContent = "GAME OVER 😿";
        menuScreen.querySelector(".menu-btn").textContent = "CHƠI LẠI 🔄";
        menuScreen.classList.remove("hidden");
    }

    // Điều khiển bằng phím Cách hoặc click chuột/phím mũi tên lên
    window.addEventListener("keydown", (e) => {
        if (e.key === " " || e.key === "ArrowUp") {
            jump();
            e.preventDefault();
        }
    });

    canvas.addEventListener("click", () => {
        jump();
        canvas.focus();
    });
</script>

</body>
</html>
