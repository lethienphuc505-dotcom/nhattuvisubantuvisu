<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Pixel Shooter Deluxe</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #020408; color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }
        .container {
            position: relative;
            width: 400px; height: 520px;
            border: 2px solid #00f0ff; border-radius: 20px;
            background: radial-gradient(circle at center, #0a1128 0%, #020408 100%);
            box-shadow: 0 0 35px rgba(0,240,255,0.3);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .menu-screen {
            position: absolute; width: 100%; height: 100%;
            background: rgba(2, 4, 8, 0.96);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; transition: opacity 0.3s ease;
        }
        .menu-screen.hidden { opacity: 0; pointer-events: none; }
        
        h1 { color: #00f0ff; font-size: 26px; margin-bottom: 5px; text-shadow: 0 0 20px rgba(0,240,255,0.8); text-align: center; }
        .subtitle { color: #8892b0; font-size: 13px; margin-bottom: 25px; text-align: center; }
        
        .menu-btn {
            width: 220px; padding: 14px 0; margin: 10px 0;
            font-size: 16px; font-weight: 800;
            background: linear-gradient(135deg, #00f0ff, #7000ff);
            color: #fff; border: none; border-radius: 14px;
            cursor: pointer; box-shadow: 0 4px 20px rgba(0,240,255,0.4);
            transition: transform 0.1s, filter 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .menu-btn:hover { filter: brightness(1.2); transform: translateY(-2px); }
        .menu-btn:active { transform: scale(0.95); }

        .menu-btn.easy { background: linear-gradient(135deg, #06d6a0, #1b4931); box-shadow: 0 4px 20px rgba(6,214,160,0.4); }
        .menu-btn.normal { background: linear-gradient(135deg, #ffb703, #fb8500); box-shadow: 0 4px 20px rgba(255,183,3,0.4); color: #020408; }
        .menu-btn.hard { background: linear-gradient(135deg, #ff3366, #7209b7); box-shadow: 0 4px 20px rgba(255,51,102,0.4); }

        .hud {
            position: absolute; top: 12px; left: 16px; right: 16px;
            display: flex; justify-content: space-between;
            font-size: 15px; font-weight: bold; z-index: 5;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
        }
        canvas { outline: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- MENU CHÍNH -->
    <div class="menu-screen" id="mainMenu">
        <h1>⚡ GALAXY PIXEL STRIKE 🚀</h1>
        <div class="subtitle">Dùng Mũi tên/A-D để di chuyển • Phím Cách bắn Laser</div>
        <button class="menu-btn" id="playBtn">PLAY ▶</button>
    </div>

    <!-- MENU CHỌN ĐỘ KHÓ -->
    <div class="menu-screen hidden" id="difficultyMenu">
        <h1>CHỌN ĐỘ KHÓ</h1>
        <div class="subtitle">SELECT DIFFICULTY</div>
        <button class="menu-btn easy" id="btnEasy">EASY</button>
        <button class="menu-btn normal" id="btnNormal">NORMAL</button>
        <button class="menu-btn hard" id="btnHard">HARD</button>
    </div>

    <div class="hud">
        <div>Điểm: <span id="score" style="color: #00f0ff; text-shadow: 0 0 10px rgba(0,240,255,0.8);">0</span></div>
        <div>Mạng: <span id="lives" style="color: #ff3366;">❤️❤️❤️</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="520" tabindex="1"></canvas>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const livesElement = document.getElementById("lives");
    const mainMenu = document.getElementById("mainMenu");
    const difficultyMenu = document.getElementById("difficultyMenu");

    let score = 0, lives = 3, isPlaying = false, gameInterval = null, difficulty = 'normal';
    let player = { x: 175, y: 410, width: 48, height: 48, speed: 6.5, dx: 0 };
    let bullets = [], enemies = [], stars = [], particles = [], enemyBullets = [], enemyDirection = 1;

    for(let i=0; i<80; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 0.5,
            speed: Math.random() * 2 + 0.5,
            alpha: Math.random() * 0.8 + 0.2
        });
    }

    // Gắn sự kiện click trực tiếp qua JS để tránh xung đột
    document.getElementById("playBtn").addEventListener("click", () => {
        mainMenu.classList.add("hidden");
        difficultyMenu.classList.remove("hidden");
    });

    document.getElementById("btnEasy").addEventListener("click", () => startGame('easy'));
    document.getElementById("btnNormal").addEventListener("click", () => startGame('normal'));
    document.getElementById("btnHard").addEventListener("click", () => startGame('hard'));

    function createEnemies() {
        enemies = [];
        let rows = (difficulty === 'easy') ? 2 : (difficulty === 'normal' ? 3 : 4);
        let cols = 5, startX = 45, startY = 60, spacingX = 64, spacingY = 52;
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                enemies.push({ x: startX + c * spacingX, y: startY + r * spacingY, width: 40, height: 36, alive: true, anim: Math.random() * Math.PI });
            }
        }
    }

    function startGame(selectedDiff) {
        difficulty = selectedDiff;
        difficultyMenu.classList.add("hidden");
        isPlaying = true; score = 0; lives = (difficulty === 'hard') ? 2 : 3; 
        bullets = []; enemyBullets = []; particles = []; player.x = 175;
        scoreElement.textContent = score; updateLivesDisplay(); createEnemies();
        canvas.focus();
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, 1000 / 60);
    }

    function updateLivesDisplay() {
        let hearts = "";
        for(let i=0; i<lives; i++) hearts += "❤️";
        livesElement.textContent = hearts;
    }

    function addExplosion(x, y, color) {
        for(let i=0; i<14; i++) {
            let angle = Math.random() * Math.PI * 2;
            let speed = Math.random() * 3.5 + 1;
            particles.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                radius: Math.random() * 3 + 1,
                color: color,
                alpha: 1,
                decay: Math.random() * 0.03 + 0.02
            });
        }
    }

    function gameLoop() { update(); draw(); }

    function update() {
        player.x += player.dx;
        if (player.x < 0) player.x = 0;
        if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].y -= 14;
            if (bullets[i].y < 0) bullets.splice(i, 1);
        }

        if (difficulty === 'hard') {
            if (Math.random() < 0.04) {
                let activeEnemies = enemies.filter(e => e.alive);
                if (activeEnemies.length > 0) {
                    let shooter = activeEnemies[Math.floor(Math.random() * activeEnemies.length)];
                    enemyBullets.push({ x: shooter.x + shooter.width/2, y: shooter.y + shooter.height });
                }
            }
